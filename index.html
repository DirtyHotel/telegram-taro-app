<title>Таро Дня</title>
<style>
  /*
    Layout: full-bleed deep-night stage; a single deck sits center,
    shuffles in place, then one card flies up and flips face-up.
  */
  :root{
    --bg: #0c0a14;
    --bg-2: #15101f;
    --ink: #ece6f5;
    --ink-dim: #9c92b3;
    --gold: #c9a24b;
    --gold-soft: #e8cf8f;
    --velvet: #241a38;
    --velvet-edge: #3a2a56;
    --card-back: #1a1328;
    color-scheme: dark;
  }

  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:
      radial-gradient(ellipse 70% 50% at 50% -10%, #2a1d42 0%, transparent 60%),
      radial-gradient(ellipse 90% 60% at 50% 110%, #1a1430 0%, transparent 55%),
      var(--bg);
    color:var(--ink);
    font-family:'Cormorant Garamond', Georgia, 'Times New Roman', serif;
    display:flex;
    flex-direction:column;
    align-items:center;
    min-height:100%;
    overflow-x:hidden;
    padding-left:max(16px, env(safe-area-inset-left,0px));
    padding-right:max(16px, env(safe-area-inset-right,0px));
  }

  .stars{
    position:fixed;
    inset:0;
    pointer-events:none;
    background-image:
      radial-gradient(1.5px 1.5px at 20% 30%, rgba(236,230,245,.55), transparent),
      radial-gradient(1px 1px at 70% 15%, rgba(236,230,245,.4), transparent),
      radial-gradient(1.5px 1.5px at 85% 60%, rgba(236,230,245,.5), transparent),
      radial-gradient(1px 1px at 10% 70%, rgba(236,230,245,.35), transparent),
      radial-gradient(1px 1px at 45% 85%, rgba(236,230,245,.4), transparent),
      radial-gradient(1.5px 1.5px at 60% 45%, rgba(236,230,245,.3), transparent),
      radial-gradient(1px 1px at 92% 85%, rgba(236,230,245,.35), transparent);
    background-repeat:no-repeat;
    opacity:.8;
    z-index:0;
  }

  header{
    position:relative;
    z-index:1;
    text-align:center;
    padding-top:clamp(28px, 6vh, 56px);
    padding-bottom:6px;
  }
  .eyebrow{
    font-family:'Cinzel', Georgia, serif;
    font-size:11px;
    letter-spacing:.32em;
    text-transform:uppercase;
    color:var(--gold-soft);
    opacity:.75;
    margin:0 0 10px;
  }
  h1{
    font-family:'Cinzel', Georgia, serif;
    font-weight:600;
    font-size:clamp(28px, 6vw, 42px);
    letter-spacing:.04em;
    margin:0;
    color:var(--ink);
    text-shadow:0 0 30px rgba(201,162,75,.18);
  }
  .sub{
    margin:10px 0 0;
    font-size:16px;
    color:var(--ink-dim);
    font-style:italic;
  }

  main{
    position:relative;
    z-index:1;
    flex:1;
    width:100%;
    max-width:520px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:flex-start;
    padding-top:clamp(18px, 4vh, 34px);
    padding-bottom:28px;
  }

  .stage{
    position:relative;
    width:200px;
    height:320px;
    margin:0 auto;
  }

  .card{
    position:absolute;
    inset:0;
    border-radius:14px;
    box-shadow:0 18px 40px -14px rgba(0,0,0,.65), 0 2px 0 rgba(255,255,255,.02) inset;
  }

  .card-back{
    width:100%;
    height:100%;
    border-radius:14px;
    background:
      repeating-linear-gradient(45deg, rgba(201,162,75,.09) 0 2px, transparent 2px 14px),
      linear-gradient(160deg, var(--card-back), #0f0a1a 70%);
    border:1px solid var(--velvet-edge);
    position:relative;
    overflow:hidden;
  }
  .card-back::before{
    content:"";
    position:absolute;
    inset:10px;
    border:1px solid rgba(201,162,75,.45);
    border-radius:8px;
  }
  .card-back::after{
    content:"✦";
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:30px;
    color:var(--gold);
    opacity:.55;
    text-shadow:0 0 18px rgba(201,162,75,.5);
  }

  /* deck of stacked backs, visible pre-shuffle and during shuffle */
  .deck{
    position:absolute;
    inset:0;
  }
  .deck .card{
    transition:transform .5s ease;
  }

  /* shuffle keyframes applied to deck cards */
  @keyframes shuffleA{
    0%{ transform:translate(0,0) rotate(0deg); }
    20%{ transform:translate(-34px,-10px) rotate(-10deg); }
    40%{ transform:translate(26px,6px) rotate(8deg); }
    60%{ transform:translate(-18px,8px) rotate(-6deg); }
    80%{ transform:translate(14px,-6px) rotate(5deg); }
    100%{ transform:translate(0,0) rotate(0deg); }
  }
  @keyframes shuffleB{
    0%{ transform:translate(0,0) rotate(0deg); }
    20%{ transform:translate(30px,8px) rotate(9deg); }
    40%{ transform:translate(-24px,-8px) rotate(-7deg); }
    60%{ transform:translate(20px,-10px) rotate(7deg); }
    80%{ transform:translate(-16px,6px) rotate(-5deg); }
    100%{ transform:translate(0,0) rotate(0deg); }
  }
  @keyframes shuffleC{
    0%{ transform:translate(0,0) rotate(0deg); }
    20%{ transform:translate(14px,-16px) rotate(5deg); }
    40%{ transform:translate(-30px,4px) rotate(-9deg); }
    60%{ transform:translate(22px,10px) rotate(8deg); }
    80%{ transform:translate(-12px,-8px) rotate(-4deg); }
    100%{ transform:translate(0,0) rotate(0deg); }
  }
  .stage.shuffling .deck .card:nth-child(3n+1){ animation:shuffleA 1.1s ease-in-out infinite; }
  .stage.shuffling .deck .card:nth-child(3n+2){ animation:shuffleB 1.3s ease-in-out infinite; }
  .stage.shuffling .deck .card:nth-child(3n+3){ animation:shuffleC 1.05s ease-in-out infinite; }

  .stage.settled .deck .card{
    animation:none !important;
  }

  /* the drawn card: flips and lifts to reveal */
  .drawn{
    position:absolute;
    inset:0;
    z-index:50;
    perspective:1200px;
    opacity:0;
    pointer-events:none;
    transition:opacity .35s ease;
  }
  .drawn.show{
    opacity:1;
    pointer-events:auto;
  }
  .drawn-inner{
    position:relative;
    width:100%;
    height:100%;
    transform-style:preserve-3d;
    transition:transform 1.1s cubic-bezier(.3,.9,.25,1);
  }
  .drawn.flip .drawn-inner{
    transform:rotateY(180deg);
  }
  .drawn-face{
    position:absolute;
    inset:0;
    border-radius:14px;
    backface-visibility:hidden;
    display:flex;
    flex-direction:column;
  }
  .drawn-face.back{
    background:
      repeating-linear-gradient(45deg, rgba(201,162,75,.09) 0 2px, transparent 2px 14px),
      linear-gradient(160deg, var(--card-back), #0f0a1a 70%);
    border:1px solid var(--velvet-edge);
  }
  .drawn-face.back::before{
    content:"";
    position:absolute;
    inset:10px;
    border:1px solid rgba(201,162,75,.45);
    border-radius:8px;
  }
  .drawn-face.back::after{
    content:"✦";
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:30px;
    color:var(--gold);
    opacity:.55;
  }
  .drawn-face.front{
    transform:rotateY(180deg);
    background:linear-gradient(165deg, var(--velvet), #1b132b 75%);
    border:1px solid var(--gold);
    box-shadow:0 0 0 1px rgba(201,162,75,.25) inset, 0 24px 48px -16px rgba(0,0,0,.7);
    padding:16px;
    justify-content:space-between;
    align-items:center;
    text-align:center;
  }
  .num{
    font-family:'Cinzel', Georgia, serif;
    font-size:12px;
    letter-spacing:.2em;
    color:var(--gold-soft);
    opacity:.8;
  }
  .glyph{
    width:112px;
    height:112px;
    margin:6px 0;
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
    flex:0 0 auto;
  }
  .glyph::before{
    content:"";
    position:absolute;
    inset:0;
    border-radius:50%;
    border:1px solid rgba(201,162,75,.4);
    background:radial-gradient(circle at 50% 36%, rgba(201,162,75,.16), transparent 72%);
  }
  .glyph svg{
    position:relative;
    width:70%;
    height:70%;
    color:var(--gold-soft);
    filter:drop-shadow(0 0 9px rgba(201,162,75,.35));
  }
  .card-name{
    font-family:'Cinzel', Georgia, serif;
    font-weight:600;
    font-size:19px;
    letter-spacing:.02em;
    color:var(--ink);
    line-height:1.25;
  }
  .orient{
    font-size:11px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--ink-dim);
  }
  .drawn.reversed .drawn-face.front > *{
    transform:rotate(180deg);
  }

  .status{
    margin-top:26px;
    min-height:24px;
    font-size:15px;
    color:var(--ink-dim);
    letter-spacing:.02em;
    text-align:center;
    font-style:italic;
  }

  button.main-btn{
    margin-top:20px;
    font-family:'Cinzel', Georgia, serif;
    font-size:13px;
    letter-spacing:.18em;
    text-transform:uppercase;
    color:var(--bg);
    background:linear-gradient(160deg, var(--gold-soft), var(--gold));
    border:none;
    border-radius:999px;
    padding:14px 34px;
    cursor:pointer;
    box-shadow:0 10px 24px -8px rgba(201,162,75,.45);
    transition:transform .15s ease, box-shadow .15s ease, opacity .2s ease;
  }
  button.main-btn:hover{ transform:translateY(-1px); box-shadow:0 14px 30px -8px rgba(201,162,75,.55); }
  button.main-btn:active{ transform:translateY(0); }
  button.main-btn:disabled{ opacity:.45; cursor:default; transform:none; box-shadow:none; }
  button.main-btn:focus-visible{ outline:2px solid var(--gold-soft); outline-offset:3px; }

  .reveal-panel{
    width:100%;
    max-width:420px;
    margin-top:30px;
    opacity:0;
    transform:translateY(8px);
    transition:opacity .5s ease .1s, transform .5s ease .1s;
  }
  .reveal-panel.show{ opacity:1; transform:translateY(0); }

  .keywords{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    justify-content:center;
    margin-bottom:16px;
  }
  .keyword{
    font-family:'Cinzel', Georgia, serif;
    font-size:11px;
    letter-spacing:.1em;
    text-transform:uppercase;
    color:var(--gold-soft);
    border:1px solid rgba(201,162,75,.35);
    border-radius:999px;
    padding:6px 14px;
    background:rgba(201,162,75,.06);
  }
  .meaning{
    font-size:17px;
    line-height:1.65;
    color:var(--ink);
    text-align:center;
    padding:0 4px;
  }
  .meaning strong{
    color:var(--gold-soft);
    font-weight:600;
  }

  footer{
    position:relative;
    z-index:1;
    padding:24px 16px calc(20px + env(safe-area-inset-bottom,0px));
    text-align:center;
    font-size:12px;
    letter-spacing:.06em;
    color:var(--ink-dim);
    opacity:.6;
  }

  @media (prefers-reduced-motion: reduce){
    .stage.shuffling .deck .card{ animation:none; }
    .drawn-inner{ transition:none; }
    .reveal-panel{ transition:none; }
  }
</style>

  <div class="reveal-panel" id="revealPanel">

</main>

    '<g fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 78 L80 78"/><path d="M28 78 A22 22 0 0 1 72 78" stroke-dasharray="1 7"/><path d="M64 24 Q80 30 76 46 Q72 58 58 54"/><path d="M58 54 L30 54"/><circle cx="40" cy="36" r="6"/><path d="M40 42 L40 54"/></g>',
    '<g fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M26 40 L34 78 L18 78 Z"/><path d="M74 40 L82 78 L66 78 Z"/><path d="M32 44 Q50 20 68 44"/><path d="M24 84 L36 84 M64 84 L76 84"/></g>',

    '<g fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M58 18 a16 16 0 1 0 0 32 a12 12 0 1 1 0 -32 Z"/><rect x="18" y="50" width="12" height="30"/><rect x="70" y="50" width="12" height="30"/><path d="M30 70 Q50 56 70 70"/><path d="M14 88 Q50 80 86 88"/></g>',

    '<g fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="50" cy="55" rx="26" ry="34"/><path d="M30 30 Q24 55 30 80 M70 30 Q76 55 70 80" stroke-dasharray="1 6"/><circle cx="50" cy="55" r="7"/><circle cx="50" cy="14" r="2.5" fill="currentColor" stroke="none"/><circle cx="50" cy="96" r="2.5" fill="currentColor" stroke="none"/><circle cx="8" cy="55" r="2.5" fill="currentColor" stroke="none"/><circle cx="92" cy="55" r="2.5" fill="currentColor" stroke="none"/></g>'
  ];

  var stage = document.getElementById('stage');
  var deck = document.getElementById('deck');
  var drawn = document.getElementById('drawn');
  var status = document.getElementById('status');
  var btn = document.getElementById('actionBtn');
  var revealPanel = document.getElementById('revealPanel');
  var keywordsEl = document.getElementById('keywords');
  var meaningEl = document.getElementById('meaning');
  var cardNum = document.getElementById('cardNum');
  var cardGlyph = document.getElementById('cardGlyph');
  var cardName = document.getElementById('cardName');
  var cardOrient = document.getElementById('cardOrient');

  var DECK_SIZE = 9;
  for (var i = 0; i < DECK_SIZE; i++) {
    var c = document.createElement('div');
    c.className = 'card';
    var back = document.createElement('div');
    back.className = 'card-back';
    c.appendChild(back);
    c.style.transform = 'translateY(' + (-i * 1.2) + 'px)';
    c.style.zIndex = String(DECK_SIZE - i);
    deck.appendChild(c);
  }

  var state = 'idle'; // idle -> shuffling -> drawing -> revealed

  function pickCard(){
    var idx = Math.floor(Math.random() * DECK.length);
    var reversed = Math.random() < 0.5;
    return {card: DECK[idx], idx: idx, reversed: reversed};
  }

  function render(result){
    cardNum.textContent = result.card.n;
    cardGlyph.innerHTML = '<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">' + ICONS[result.idx] + '</svg>';
    cardName.textContent = result.card.name;
    cardOrient.textContent = result.reversed ? 'Перевёрнуто' : 'Прямое положение';
    drawn.classList.toggle('reversed', result.reversed);

    var kws = (result.reversed ? result.card.down : result.card.up).split(', ');
    keywordsEl.innerHTML = '';
    kws.forEach(function(k){
      var el = document.createElement('span');
      el.className = 'keyword';
      el.textContent = k;
      keywordsEl.appendChild(el);
    });
    meaningEl.innerHTML = '<strong>' + result.card.name +
      (result.reversed ? ' (перевёрнутая)' : '') + '</strong> сегодня говорит о: ' +
      (result.reversed ? result.card.down : result.card.up) + '.';
  }

  function startShuffle(){
    if (state !== 'idle' && state !== 'revealed') return;
    state = 'shuffling';
    btn.disabled = true;
    revealPanel.classList.remove('show');
    drawn.classList.remove('show', 'flip');
    stage.classList.remove('settled');
    status.textContent = 'Тасуем колоду…';
    stage.classList.add('shuffling');

    var shuffleDuration = 1900;
    setTimeout(function(){
      stage.classList.remove('shuffling');
      stage.classList.add('settled');
      status.textContent = 'Снимаем верхнюю карту…';
      setTimeout(drawCard, 450);
    }, shuffleDuration);
  }

  function drawCard(){
    state = 'drawing';
    var result = pickCard();
    render(result);
    drawn.classList.add('show');

    requestAnimationFrame(function(){
      requestAnimationFrame(function(){
        drawn.classList.add('flip');
      });
    });

    setTimeout(function(){
      status.textContent = 'Ваша карта на сегодня';
      revealPanel.classList.add('show');
      btn.textContent = 'Тасовать снова';
      btn.disabled = false;
      state = 'revealed';
    }, 1250);
  }

  btn.addEventListener('click', startShuffle);

  function start(savedData){
    // no persisted state needed; each open starts fresh
  }
  if (window.claude && window.claude.hot && window.claude.hot.ready) {
    window.claude.hot.ready(start);
  } else {
    start({});
  }
})();
</script>
